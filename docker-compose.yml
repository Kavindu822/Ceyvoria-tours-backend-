services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ceyvoria
      POSTGRES_USER: ceyvoria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ceyvoria_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceyvoria -d ceyvoria"]
      interval: 5s
      timeout: 4s
      retries: 10
volumes:
  ceyvoria_pg_data:
